<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>
<body>
    <h1>Student List</h1>
    <ul>
        {% for student in students %}
            <li>ID: {{ student.id }} - Name: {{ student.name }}</li>
        {% empty %}
            <li>No students yet. Add via /admin/.</li>
        {% endfor %}
    </ul>
</body>
</html>
