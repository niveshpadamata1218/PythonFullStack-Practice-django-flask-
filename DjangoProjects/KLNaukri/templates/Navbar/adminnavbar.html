<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navbar with Footer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <!-- Custom CSS -->
  <style>
    body {
      padding-top: 80px;
      padding-bottom: 60px; /* space for footer */
      background-color: #0f1115;
      color: #ffffff;
    }

    /* Navbar */
    .navbar-custom {
      backdrop-filter: blur(10px);
      background: rgba(20, 20, 25, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .navbar-brand {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .nav-link {
      color: #cfd2d6 !important;
      transition: color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #ffffff !important;
    }

    .dropdown-menu {
      background-color: #1a1d23;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .dropdown-item {
      color: #cfd2d6;
    }

    .dropdown-item:hover {
      background-color: #2a2e36;
      color: #ffffff;
    }

    .form-control {
      background-color: #1a1d23;
      border: 1px solid rgba(255,255,255,0.15);
      color: #ffffff;
    }

    .form-control::placeholder {
      color: #9aa0a6;
    }

    .form-control:focus {
      background-color: #1a1d23;
      color: #ffffff;
      box-shadow: none;
      border-color: #ffffff;
    }

    /* Footer */
    #sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #9a0a0a;
      color: #ffffff;
      padding: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
  <div class="container-fluid">

    <a class="navbar-brand" href="#">MySite</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'adminapphomepage' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Features</a>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            PFSD-CLASS
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'printer' %}">Printer</a></li>
              <li><a class="dropdown-item" href='/printer'>PRINTER-2</a></li>
            <li><a class="dropdown-item" href='/Timetable'>Time table</a></li>
               <li><a class="dropdown-item" href="#">action</a></li>

            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link disabled" tabindex="-1" aria-disabled="true">Disabled</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">SignUp</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Login</a>
        </li>

      </ul>

      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-light" type="submit">Search</button>
      </form>

    </div>
  </div>
</nav>

<!-- Page Content -->
{% block body %}
<div class="container mt-4">
  <h1>Welcome</h1>
  <p>Your page content goes here.</p>
</div>
{% endblock %}

<!-- Footer -->
<footer id="sticky-footer" class="flex-shrink-0 py-sm-1">
  <div class="container text-center">
    <small>
      Copyright &copy; Dr. Deepak. V - K L University.
      All rights reserved
    </small>
  </div>
</footer>

<!-- Bootstrap JS -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"
></script>

</body>
</html>
